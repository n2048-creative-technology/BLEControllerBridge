sentence=Zero-dependency BLE controller input bridge for ESP32: discover, bond, and read any BLE gamepad or custom BLE remote.
paragraph=Connects to any BLE controller -- recognized HID gamepads and fully custom/no-name BLE peripherals alike -- using only the ESP32 Arduino core's built-in BLE library (no external dependencies). Persists pairing across reboots. Exposes a simple event-driven API (onConnect/onDisconnect/onButton/onRawData) for robotics, animatronics, and automation projects.
